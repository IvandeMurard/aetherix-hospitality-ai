<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Logo Mark: Overlapping Circles -->
  <g transform="translate(400, 250)">
    <!-- Circle 1: Sage Green -->
    <circle cx="-30" cy="0" r="80" stroke="#8A9A83" stroke-width="2" fill="none" opacity="0.8"/>
    <!-- Circle 2: Warm Taupe -->
    <circle cx="30" cy="0" r="80" stroke="#A8927A" stroke-width="2" fill="none" opacity="0.8"/>
    <!-- Intersection: Bronze/Olive (Synthesis) -->
    <clipPath id="clipIntersection">
      <circle cx="-30" cy="0" r="80" />
    </clipPath>
    <circle cx="30" cy="0" r="80" stroke="#6B5E4F" stroke-width="2.5" fill="none" clip-path="url(#clipIntersection)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(400, 420)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="52" font-weight="400" fill="#4A4A4A" text-anchor="middle" letter-spacing="4">AETHERIX</text>
    <!-- Tagline -->
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#7A7A7A" text-anchor="middle" letter-spacing="2">Operational Intelligence</text>
  </g>
</svg>
