name: Eval-by-Design Gate

# EVAL-1 enforcement layer (HOS-216, ADR-0007 §4 / §D2.d).
# Runs the eval coverage gate on PRs touching model/LLM/memory/provider/prompt
# code or the golden dataset, and posts a sticky report comment.
#
# Rollout (AC5): now BLOCKING — EVAL_GATE_BLOCKING="true" means a FAIL (exit 1:
# regression >3pp or coverage <60%) or ERROR (exit 2) blocks the merge. WARN
# (exit 3: coverage 60–80% or touched-but-not-evaluated) stays non-blocking.
# Flipped WARN→blocking on 2026-07-04 (HOS-274) after a CI canary (PR #185) proved
# Prophet-in-CI deterministic: 3 consecutive runs, identical forecast MAPE 25.40%,
# 0 regressions, 0.00pp run-to-run variance vs the re-frozen baseline (PR #175).
# The R2/R4 stochasticity risk was env-drift, resolved by freezing from CI.
# See CLAUDE.md Décision #29 + ADR-0007 §D2.g. Emergency rollback = "false".

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-gate:
    name: eval-gate
    runs-on: ubuntu-latest
    env:
      EVAL_GATE_BLOCKING: "true"
      GITHUB_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run eval coverage gate
        id: gate
        run: |
          set +e
          uv run --project backend python scripts/ci/check_eval_coverage.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --md-out eval-report.md \
            --json-out eval-result.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: eval-report
          path: eval-report.md

      - name: Enforce verdict (WARN mode = non-blocking)
        if: always()
        run: |
          code="${{ steps.gate.outputs.exit_code }}"
          echo "eval gate exit code: $code"
          if [ "$EVAL_GATE_BLOCKING" = "true" ] && { [ "$code" = "1" ] || [ "$code" = "2" ]; }; then
            echo "::error::Eval-by-design gate failed (exit $code) — blocking."
            exit 1
          fi
          echo "WARN mode — verdict surfaced in the PR comment, not blocking."
          echo "Flip EVAL_GATE_BLOCKING to 'true' to enforce."
