name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # AC4 — Ruff linting (E/F errors only)
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ruff-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-ruff-

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      # Run from backend/ so ruff discovers backend/pyproject.toml ([tool.ruff.lint])
      # CLI --ignore extends config.ignore (CLI --select replaces config.select),
      # so E501 must be re-asserted here when --select E,F is used.
      - name: Check linting (E/F errors — AC4)
        working-directory: backend
        run: ruff check . --select E,F --ignore E501

  # ---------------------------------------------------------------------------
  # AC1/AC2/AC5/AC6 — pytest + coverage
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aetherix_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: aetherix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://aetherix_test:test_password@localhost:5432/aetherix_test
      REDIS_URL: redis://localhost:6379
      # IMPORTANT: do NOT inject TWILIO_ACCOUNT_SID/AUTH_TOKEN/FROM_NUMBER/WHATSAPP_FROM
      # or LINEAR_API_KEY here. config.py reads them at module-import time and freezes
      # the value, breaking "not configured" tests. Tests that need them use
      # patch("app.core.config.TWILIO_*", ...) directly. Lazy-read secrets (ANTHROPIC/
      # MISTRAL/APALEO/...) are cleared per-test in tests/conftest.py instead.
      TWILIO_SKIP_SIGNATURE_VALIDATION: "true"
      LLM_BACKEND: claude
      LLM_MODEL: claude-sonnet-4-6
      EMBEDDING_BACKEND: mistral
      EMBEDDING_MODEL: mistral-embed
      DEMO_MODE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # AC6 — cache hit target < 30s when pyproject.toml unchanged
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      # AC1/AC2 — pytest with coverage gate
      # -v + --tb=short so the first failure is fully visible in the GH Actions UI summary
      - name: Run pytest with coverage
        working-directory: backend
        run: |
          uv run pytest tests/ -x --timeout=60 -v --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      # AC2 — upload coverage XML as artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

      # AC2 — PR annotation showing per-module coverage
      - name: Coverage annotation
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_DATA_FILE: backend/.coverage
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # HOS-150 AC8 — Schema drift check (static SQL parse, no live DB required)
  # Compares ORM Base.metadata against columns extracted from supabase/migrations
  # and fails on any drift not acknowledged in scripts/schema_drift_ignore.json.
  # ---------------------------------------------------------------------------
  schema-drift:
    name: schema-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Check schema drift (strict)
        working-directory: backend
        run: uv run python ../scripts/ci/check_schema_drift.py --strict --print-ignored

  # ---------------------------------------------------------------------------
  # HOS-204 (EVAL-0) — golden dataset validation: JSONL schema, unique kebab-case
  # ids, known category/layer, per-category min counts (AC0.1). Stdlib only.
  # ---------------------------------------------------------------------------
  eval-dataset:
    name: eval-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate golden dataset
        run: python scripts/eval/validate_dataset.py

  # ---------------------------------------------------------------------------
  # HOS-320 D1 — CLAUDE.md and AGENTS.md must stay twins.
  #
  # Blocking on every PR, unlike the other three detectors which stay on the
  # weekly cron. D1 is the only one that qualifies: it is binary, instant, and
  # has an escape hatch (HARNESS_EXCEPTIONS) for a legitimate divergence. D2/D3
  # findings are judgement calls and D4 is a backlog — blocking on those would
  # teach everyone to bypass the gate.
  #
  # Added only after the drift recurred: it first appeared as a one-off
  # find-replace, then came back the next time CLAUDE.md was edited without
  # resyncing AGENTS.md. Building the guard before the second occurrence would
  # have been speculative.
  # ---------------------------------------------------------------------------
  harness-drift:
    name: harness-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only — no install step needed.
      - name: Check CLAUDE.md ↔ AGENTS.md
        run: |
          if ! python scripts/ops/hygiene_architecturale.py --detectors D1; then
            echo ""
            echo "❌ Les deux fichiers de harness ont divergé."
            echo "   Ils doivent porter un contenu identique — seul leur propre nom diffère."
            echo ""
            echo "   Resynchroniser :"
            echo "     python -c \"from pathlib import Path; Path('AGENTS.md').write_text(Path('CLAUDE.md').read_text(encoding='utf-8').replace('CLAUDE.md','AGENTS.md'), encoding='utf-8')\""
            echo ""
            echo "   Si la divergence est légitime (instruction propre à un harness),"
            echo "   l'inscrire dans HARNESS_EXCEPTIONS avec sa justification."
            exit 1
          fi
