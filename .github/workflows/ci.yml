name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # AC4 — Ruff linting (E/F errors only)
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ruff-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-ruff-

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      # Run from backend/ so ruff discovers backend/pyproject.toml ([tool.ruff.lint])
      # CLI --ignore extends config.ignore (CLI --select replaces config.select),
      # so E501 must be re-asserted here when --select E,F is used.
      - name: Check linting (E/F errors — AC4)
        working-directory: backend
        run: ruff check . --select E,F --ignore E501

  # ---------------------------------------------------------------------------
  # AC1/AC2/AC5/AC6 — pytest + coverage
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aetherix_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: aetherix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://aetherix_test:test_password@localhost:5432/aetherix_test
      REDIS_URL: redis://localhost:6379
      # IMPORTANT: do NOT inject TWILIO_ACCOUNT_SID/AUTH_TOKEN/FROM_NUMBER/WHATSAPP_FROM
      # or LINEAR_API_KEY here. config.py reads them at module-import time and freezes
      # the value, breaking "not configured" tests. Tests that need them use
      # patch("app.core.config.TWILIO_*", ...) directly. Lazy-read secrets (ANTHROPIC/
      # MISTRAL/APALEO/...) are cleared per-test in tests/conftest.py instead.
      TWILIO_SKIP_SIGNATURE_VALIDATION: "true"
      LLM_BACKEND: claude
      LLM_MODEL: claude-sonnet-4-6
      EMBEDDING_BACKEND: mistral
      EMBEDDING_MODEL: mistral-embed
      DEMO_MODE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # AC6 — cache hit target < 30s when pyproject.toml unchanged
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      # AC1/AC2 — pytest with coverage gate
      # -v + --tb=short so the first failure is fully visible in the GH Actions UI summary
      - name: Run pytest with coverage
        working-directory: backend
        run: |
          uv run pytest tests/ -x --timeout=60 -v --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      # AC2 — upload coverage XML as artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

      # AC2 — PR annotation showing per-module coverage
      - name: Coverage annotation
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_DATA_FILE: backend/.coverage
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # HOS-150 AC8 — Schema drift check (static SQL parse, no live DB required)
  # Compares ORM Base.metadata against columns extracted from supabase/migrations
  # and fails on any drift not acknowledged in scripts/schema_drift_ignore.json.
  # ---------------------------------------------------------------------------
  schema-drift:
    name: schema-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Check schema drift (strict)
        working-directory: backend
        run: uv run python ../scripts/ci/check_schema_drift.py --strict --print-ignored

  # ---------------------------------------------------------------------------
  # HOS-204 (EVAL-0) — golden dataset validation: JSONL schema, unique kebab-case
  # ids, known category/layer, per-category min counts (AC0.1). Stdlib only.
  # ---------------------------------------------------------------------------
  eval-dataset:
    name: eval-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate golden dataset
        run: python scripts/eval/validate_dataset.py

  # ---------------------------------------------------------------------------
  # Public status file (ADR-0010) — the only source of the Aetherix status block
  # in the public meta-repo README. Schema, taxonomy, evidence on this branch,
  # leak denylist. Blocking.
  #
  # Runs on every PR, not only those touching public-status.yml: a PR that
  # renames or deletes an evidence file breaks a "Built" claim without touching
  # the status file, and this is the PR that must see it. The check is instant.
  # A stale `verified_on` is a warning, never a failure.
  # ---------------------------------------------------------------------------
  public-status:
    name: public-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install "pyyaml>=6.0,<7"

      - name: Validate public-status.yml
        run: python scripts/ci/check_public_status.py

  # ---------------------------------------------------------------------------
  # HOS-320 D1 — CLAUDE.md and AGENTS.md must stay twins.
  #
  # Blocking on every PR, unlike the other three detectors which stay on the
  # weekly cron. D1 is the only one that qualifies: it is binary, instant, and
  # has an escape hatch (HARNESS_EXCEPTIONS) for a legitimate divergence. D2/D3
  # findings are judgement calls and D4 is a backlog — blocking on those would
  # teach everyone to bypass the gate.
  #
  # Added only after the drift recurred: it first appeared as a one-off
  # find-replace, then came back the next time CLAUDE.md was edited without
  # resyncing AGENTS.md. Building the guard before the second occurrence would
  # have been speculative.
  # ---------------------------------------------------------------------------
  harness-drift:
    name: conventions-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only — no install step needed.
      #
      # Blocking subset: the detectors whose verdict is unambiguous and whose fix
      # is mechanical. D2/D3/D4 stay report-only — they legitimately surface
      # `info` findings (planned paths, curated env subset) that must not fail a PR.
      - name: Conventions documentaires (D1 harness · D5 plafond · D6 comptes)
        run: |
          if ! python scripts/ops/hygiene_architecturale.py --detectors D1,D5,D6; then
            echo ""
            echo "❌ Une convention documentaire est violée. Voir le détail au-dessus."
            echo ""
            echo "  D1 — CLAUDE.md et AGENTS.md ont divergé."
            echo "     AGENTS.md est un dérivé de CLAUDE.md : le régénérer, pas l'éditer."
            echo "       python scripts/ops/hygiene_architecturale.py --fix"
            echo "     Divergence légitime (instruction propre à un harness) → HARNESS_EXCEPTIONS, avec justification."
            echo ""
            echo "  D5 — un fichier dépasse le plafond qu'il déclare lui-même."
            echo "     Extraire une section vers un sous-fichier et ne garder qu'un pointeur,"
            echo "     ou relever le plafond dans la ligne de règle si la croissance est assumée."
            echo "     Le seuil est lu dans le fichier, jamais codé dans le script."
            echo ""
            echo "  D6 — un compte annoncé ne correspond plus à sa source."
            echo "     Préférer retirer le nombre codé en dur plutôt que le corriger :"
            echo "     un chiffre dupliqué dérive au premier ajout."
            exit 1
          fi

      # D10 — dead-man's switch du cron hebdomadaire (HOS-325).
      #
      # Il est porté ici, et pas par le workflow qu'il surveille : un chien de
      # garde hébergé par le processus qu'il observe meurt avec lui. La CI de PR
      # tourne dès que quelqu'un travaille, c'est le seul support fiable.
      #
      # Volontairement NON bloquant. Un cron mort n'est pas la faute de l'auteur
      # de la PR courante, et faire échouer son merge pour ça apprend à
      # contourner le gate — même raison que D2/D3/D4 restent report-only.
      - name: Cron d'hygiène en vie (D10 — avertissement, jamais bloquant)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! python scripts/ops/hygiene_architecturale.py --detectors D10; then
            echo "::warning title=Cron d'hygiène muet::Le workflow hebdomadaire n'a pas abouti depuis plus de 10 jours. Son silence ne prouve donc plus l'absence de drift — vérifier Actions → Hygiène architecturale."
            {
              echo "### ⚠️ Cron d'hygiène muet"
              echo
              echo "Le workflow hebdomadaire ne parle que lorsqu'il trouve du drift."
              echo "Passé le seuil, l'hypothèse la plus probable n'est plus « aucun drift »"
              echo "mais « plus personne ne regarde »."
              echo
              echo "GitHub désactive un cron après 60 jours sans activité du dépôt."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # D11 — main au rouge (11/08/2026).
      #
      # Écrit après que le scénario s'est produit : le 05/08, D1 a échoué sur la
      # PR qui introduisait le drift (#239), la PR a été mergée rouge, et quatre
      # PRs se sont empilées sur le même rouge pendant six jours. La détection
      # avait fonctionné du premier coup — c'est la sanction qui manquait.
      #
      # Ce dépôt est privé sur un plan gratuit : `branches/main/protection` et
      # `rulesets` répondent 403. « Bloquant » ne peut donc signifier que
      # *rouge visible*, jamais *merge refusé*. Nommer un rouge installé est le
      # seul garde-fou restant.
      #
      # NON bloquant, même raison que D10 : le rouge de main n'est pas la faute
      # de l'auteur de la PR courante.
      - name: CI de main au rouge (D11 — avertissement, jamais bloquant)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! python scripts/ops/hygiene_architecturale.py --detectors D11; then
            echo "::warning title=CI de main au rouge::Le dernier run de CI sur main a échoué il y a plus de 2 jours. Aucune protection de branche n'est disponible sur ce dépôt : un rouge installé masque le suivant."
            {
              echo "### ⚠️ CI de main au rouge"
              echo
              echo "Aucune protection de branche n'est disponible (dépôt privé, plan gratuit)."
              echo "Un check rouge n'empêche jamais un merge — il ne reste que la lecture humaine,"
              echo "et un rouge installé cesse d'être lu."
              echo
              echo "Réparer le rouge, ou le documenter s'il est légitime."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
