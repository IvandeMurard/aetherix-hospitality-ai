name: Eval — parser provider matrix

# HOS-337 · Décision #35 D3. Runs the parser eval layer against real LLMs, one
# pinned provider/model per job, then writes a side-by-side comparison to the
# run summary. Manual only: it costs API calls and needs keys, so it never runs
# on PRs and never blocks a merge (the PR gate keeps the deterministic fake).
#
# Secrets: ANTHROPIC_API_KEY and GEMINI_API_KEY. A missing key fails that job
# loudly rather than skipping — a matrix with a silent hole compares nothing.
#
# Inputs `runs` and `update_baseline` (HOS-342):
#   - runs >= 3 measures run-to-run variance; it is also the floor for freezing.
#   - update_baseline freezes one baseline per target, keyed (target, dataset
#     version). The freeze is refused unless the runs agree (canary rule,
#     Décision #29) — the job then fails red, it never silently skips.
#   - This workflow does NOT commit (contents: read). A frozen baseline is uploaded
#     as the `parser-baseline-<provider>` artifact and lands on main through a PR,
#     like every other baseline.

on:
  workflow_dispatch:
    inputs:
      claude_model:
        description: "Exact Claude model id (not a tier)"
        required: false
        default: "claude-haiku-4-5-20251001"
      gemini_model:
        description: "Exact Gemini model id (not a tier)"
        required: false
        default: "gemini-2.0-flash"
      runs:
        description: "Runs per target (>= 3 measures variance; required to freeze)"
        type: choice
        options: ["1", "3", "5"]
        default: "3"
      update_baseline:
        description: "Freeze the real baseline per target (needs runs >= 3); uploaded as an artifact, committed via PR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    name: parser · ${{ matrix.provider }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, gemini]
    env:
      EVAL_PARSER_BACKEND: real
      EVAL_PARSER_TARGET: ${{ matrix.provider == 'claude' && format('claude:{0}', inputs.claude_model) || format('gemini:{0}', inputs.gemini_model) }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run parser eval on the pinned target
        env:
          RUNS: ${{ inputs.runs }}
          UPDATE_BASELINE: ${{ inputs.update_baseline }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          extra=()
          if [ "$UPDATE_BASELINE" = "true" ]; then
            if [ "$RUNS" -lt 3 ]; then
              echo "::error::update_baseline needs runs >= 3 (canary rule, Décision #29); got $RUNS. Nothing was frozen."
              exit 1
            fi
            extra+=(--update-baseline)
          fi
          uv run --project backend python -m scripts.eval.run_all \
            --layers parser --runs "$RUNS" "${extra[@]}" \
            --json-out "out/$PROVIDER.json" \
            --md-out "out/$PROVIDER.md"
          cat "out/$PROVIDER.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$UPDATE_BASELINE" = "true" ]; then
            {
              echo
              echo "**Baseline frozen for \`$EVAL_PARSER_TARGET\`** — artifact \`parser-baseline-$PROVIDER\`."
              echo "Not committed by this workflow: land it on main through a PR."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-${{ matrix.provider }}
          path: out/

      - name: Upload frozen baseline
        if: inputs.update_baseline
        uses: actions/upload-artifact@v4
        with:
          name: parser-baseline-${{ matrix.provider }}
          path: eval/baselines/parser/
          if-no-files-found: error

  compare:
    name: compare
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: parser-*
          path: out
          merge-multiple: true

      - name: Side-by-side table
        run: python -m scripts.eval.compare_parser_targets out/*.json >> "$GITHUB_STEP_SUMMARY"
