# Aetherix backend — Fly.io configuration
# Région : Paris (cdg) pour latence FR + GDPR

app = "aetherix-backend"
primary_region = "cdg"

[build]

[env]
  PORT = "8000"
  APP_ENV = "staging"
  # Production env vars set via `fly secrets set ...` — see runbook-pre-pilot.md

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # APScheduler workers must stay alive
  auto_start_machines = true
  min_machines_running = 1     # Toujours 1 instance (cron jobs internes)
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024            # Prophet a besoin de RAM pour fit()
