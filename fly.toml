# fly.toml app configuration file generated for aetherix-hospitality-ai-6hzt-w on 2026-11-05T15:25:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aetherix-hospitality-ai-6hzt-w'
primary_region = 'cdg'

[build]
[env]
  APP_ENV = 'staging'
  PORT = '8000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
